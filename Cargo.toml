[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/v3nn7/Kova-native"
readme = "README.md"
keywords = ["gui", "gpu", "ui", "desktop", "reactive"]
categories = ["gui", "graphics", "rendering"]
include = ["src/**", "Cargo.toml", "LICENSE"]
publish = ["crates-io"]
rust-version = "1.89"

[workspace.dependencies]
kova-native = { version = "0.3.1", path = "crates/kova-native" }
kova-native-core = { version = "0.3.1", path = "crates/kova-native-core" }
kova-native-render = { version = "0.3.1", path = "crates/kova-native-render" }
kova-native-layout = { version = "0.3.1", path = "crates/kova-native-layout" }
kova-native-text = { version = "0.3.1", path = "crates/kova-native-text" }
kova-native-input = { version = "0.3.1", path = "crates/kova-native-input" }
kova-native-animation = { version = "0.3.1", path = "crates/kova-native-animation" }
kova-native-platform = { version = "0.3.1", path = "crates/kova-native-platform" }
kova-native-assets = { version = "0.3.1", path = "crates/kova-native-assets" }
kova-native-widgets = { version = "0.3.1", path = "crates/kova-native-widgets" }

wgpu = { version = "30", default-features = false, features = ["std", "dx12", "vulkan", "metal", "wgsl"] }
winit = "0.30.13"
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
cosmic-text = "0.19"
resvg = { version = "0.48", default-features = false }
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
etagere = "0.2.15"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
arboard = { version = "3.6", default-features = false }
slotmap = "1.1"
smallvec = { version = "1.15", features = ["union", "const_generics"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
parking_lot = "0.12"
rustc-hash = "2"
unicode-segmentation = "1.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
